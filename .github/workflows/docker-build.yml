name: Build & publish Docker image

# Builds a multi-arch (linux/amd64 + linux/arm64) image and publishes it to the
# GitHub Container Registry (ghcr.io). amd64 covers Intel/AMD servers; arm64
# covers Apple Silicon / ARM hosts.
#
# Images are pushed to: ghcr.io/<owner>/kandeck
#   - :latest        on the default branch
#   - :vX.Y.Z, :X.Y  on a version tag (e.g. push a tag `v1.0.0`)
#   - :sha-<commit>  always
#
# No secrets to configure — it authenticates with the built-in GITHUB_TOKEN.
# (After the first successful run, set the package visibility to Public in your
# repo's Packages settings if you want anyone to pull it.)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:      # allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kandeck

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
