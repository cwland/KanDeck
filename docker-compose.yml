# KanDeck — docker-compose for the host web server.
# Data persists on the host via a bind mount so backups & boards survive
# container rebuilds.
services:
  kandeck:
    build:
      context: .
      dockerfile: Dockerfile
    image: kandeck:latest
    container_name: kandeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data
      # Secrets — set these in a .env file next to this compose file (which must
      # be kept OUT of source control). Generate each with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Encrypts secrets at rest (SMTP password, AI token). Decoupled from
      # JWT_SECRET so you can rotate the session secret independently. If unset,
      # falls back to JWT_SECRET for backward compatibility.
      SECRETS_KEY: ${SECRETS_KEY:-}
      API_KEY: ${API_KEY:-}
      # Public URL (used for calendar-feed links) and reverse-proxy trust —
      # set TRUST_PROXY=1 when behind Nginx Proxy Manager / Cloudflare Tunnel.
      APP_URL: ${APP_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SESSION_TTL: ${SESSION_TTL:-7d}
      # Email/Discord notifications and backup frequency/retention are configured
      # in the app (App Settings → Notifications / Backups), not here. BACKUP_*
      # below are only pre-UI fallbacks.
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * 0}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-12}
    volumes:
      # Host-side bind mount → survives rebuilds (spec: bind-mounted host dir).
      - ./data:/app/data
